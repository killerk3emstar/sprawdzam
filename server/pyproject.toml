[project]
name = "sprawdzam-server"
version = "0.1.0"
description = "Sprawdzam / Second Ear backend: Twilio call webhook, media stream, speech-to-text and scam risk engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "twilio>=9.0",
    "numpy>=2.0",
    "soxr>=0.5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
timeout = 60
markers = [
    "live: talks to the real whisper-server / basal-serve (opt in: uv run pytest -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Standalone model-bench scripts (run with `uv run <script>`), not part of the backend.
extend-exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests parse our own TwiML responses with the stdlib XML parser.
"tests/**" = ["S101", "S105", "S106", "S314"]
# Local dev scripts: fixed tool names (`say`, `ffmpeg`), asserts on test responses.
"scripts/**" = ["S101", "S603", "S607"]
