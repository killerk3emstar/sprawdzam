<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprawdzam demo</title>
<style>
:root { --font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --bg: #0b0f15; --panel: #131a23; --line: #263140; --fg: #f1f5f9; --muted: #94a3b8; --accent: #60a5fa; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 17px/1.45 var(--font); }
main { max-width: 980px; margin: 0 auto; padding: 32px 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.7rem; }
h1 small { display: block; color: var(--muted); font-size: .9rem; font-weight: 500; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 8px 14px; color: var(--muted); font: 700 .85rem var(--font); cursor: pointer; }
.lang button.on { background: #1b2430; color: var(--fg); }
.grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-top: 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.links { display: grid; gap: 10px; }
.links a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--fg); text-decoration: none; }
.links a:hover { border-color: var(--accent); }
.links b { display: block; font-size: 1.1rem; }
.links span { color: var(--muted); font-size: .9rem; }
.links code { color: var(--accent); font: .85rem var(--mono); }
.qr { display: grid; justify-items: center; gap: 12px; text-align: center; }
.qr #qr { width: min(100%, 300px); aspect-ratio: 1; background: #fff; border-radius: 12px; padding: 12px; }
.qr #qr svg { width: 100%; height: 100%; display: block; }
label { display: grid; gap: 6px; color: var(--muted); font-size: .85rem; width: 100%; text-align: left; }
input { font: 16px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
.url { font: .95rem var(--mono); color: var(--accent); word-break: break-all; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sprawdzam <small data-i18n="sub"></small></h1>
    <div class="lang"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div>
  </header>
  <div class="grid">
    <div class="panel links">
      <a href="/dev/caller"><b data-i18n="caller"></b><span data-i18n="callerSub"></span> <code>/dev/caller</code></a>
      <a href="/dev/jury"><b data-i18n="jury"></b><span data-i18n="jurySub"></span> <code>/dev/jury</code></a>
      <a href="/dev/jury?mock=1"><b data-i18n="mock"></b><span data-i18n="mockSub"></span> <code>/dev/jury?mock=1</code></a>
      <a href="/dev/jury?tab=operator"><b data-i18n="operator"></b><span data-i18n="operatorSub"></span> <code>/dev/jury?tab=operator</code></a>
      <a href="/dev/senior"><b data-i18n="senior"></b><span data-i18n="seniorSub"></span> <code>/dev/senior</code></a>
      <p class="hint"><span data-i18n="current"></span> <span class="url" id="here"></span></p>
    </div>
    <div class="panel qr">
      <b data-i18n="qrTitle"></b>
      <div id="qr" role="img" aria-label="QR"></div>
      <div class="url" id="target"></div>
      <label><span data-i18n="base"></span><input id="base" autocomplete="off" spellcheck="false"></label>
      <p class="hint" id="localHint" data-i18n="localHint"></p>
    </div>
  </div>
</main>
<script type="module">
import { renderSVG } from "/dev/static/vendor/uqr.js";

const $ = (id) => document.getElementById(id);
const T = {
  pl: {
    sub: "Strony demonstracyjne", caller: "Symulator sieci operatora", callerSub: "Telefon oszusta (iPhone, Safari).",
    jury: "Konsola dla jury", jurySub: "Ekran na projektor: transkrypcja, ryzyko, działania.",
    mock: "Konsola: tryb demo", mockSub: "Odtwarza przykładową rozmowę bez backendu.",
    operator: "Panel operatora", operatorSub: "Alerty bez treści rozmów.",
    senior: "Aplikacja seniora w przeglądarce", seniorSub: "Zastępuje apkę na Androidzie.",
    current: "Ta strona:", qrTitle: "Zeskanuj iPhonem (oszust)", base: "Adres publiczny (tunel)",
    localHint: "Adres lokalny nie zadziała na telefonie: otwórz tę stronę przez adres tunelu https albo wpisz go wyżej.",
  },
  en: {
    sub: "Demo pages", caller: "Operator network simulator", callerSub: "The scammer's phone (iPhone, Safari).",
    jury: "Jury console", jurySub: "Projector screen: transcript, risk, actions.",
    mock: "Console: demo mode", mockSub: "Replays a sample call without the backend.",
    operator: "Operator console", operatorSub: "Alerts without any call content.",
    senior: "Senior app in the browser", seniorSub: "Stands in for the Android app.",
    current: "This page:", qrTitle: "Scan with the iPhone (scammer)", base: "Public address (tunnel)",
    localHint: "A local address will not work on a phone: open this page through the https tunnel address or type it above.",
  },
};
let ui = "pl";
try { ui = localStorage.getItem("indexLang") || "pl"; } catch {}
if (!T[ui]) ui = "pl";

function applyLang() {
  document.documentElement.lang = ui;
  document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = T[ui][e.dataset.i18n]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === ui));
}
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => {
  ui = b.dataset.lang;
  try { localStorage.setItem("indexLang", ui); } catch {}
  applyLang();
});

function draw() {
  const base = $("base").value.trim().replace(/\/+$/, "") || location.origin;
  const url = `${base}/dev/caller`;
  $("target").textContent = url;
  $("qr").innerHTML = renderSVG(url, { ecc: "M", border: 2, pixelSize: 8 });
  const local = /^https?:\/\/(localhost|127\.|\[::1\]|0\.0\.0\.0)/.test(base);
  $("localHint").hidden = !local;
}

$("here").textContent = location.href;
$("base").value = location.origin;
$("base").oninput = draw;
applyLang();
draw();
</script>
</body>
</html>
