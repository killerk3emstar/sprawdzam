<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F7F5">
<title>Operator network simulator</title>
<style>
:root { --font: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
        --bg: #F7F7F5; --fg: #111; --muted: #6A6A66; --faint: #A3A39E; --line: #DCDCD7;
        --bad: #C0261A; --warn: #A15C00; --ok: #1F7A3D; --okd: #19683A; --badd: #A31F15; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 17px/1.4 var(--font); min-height: 100vh; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
main { max-width: 520px; margin: 0 auto;
       padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.3rem; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; margin: 0; }
h1 small { display: block; color: var(--muted); font-size: .9rem; font-weight: 400; letter-spacing: 0; margin-top: 4px; }
.lang { display: flex; flex: none; }
.lang button, .mini button { color: var(--faint); font-size: .9rem; min-width: 40px; min-height: 40px; }
.lang button.on, .mini button.on { color: var(--fg); font-weight: 600; }

/* Status: plain text, the timer in tabular figures. */
.statuszone { margin-top: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.status { display: flex; align-items: baseline; gap: 12px; }
.status > span:nth-child(2) { flex: 1; min-width: 0; }
.status .led { display: none; }
.status b { display: block; font-size: 1.6rem; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
.status small { display: block; color: var(--muted); font-size: .95rem; margin-top: 4px; }
.status .timer { font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.banner { margin-top: 14px; padding: 2px 0 2px 12px; border-left: 3px solid var(--bad); color: var(--bad); font-weight: 600; }
.banner.info { border-left-color: var(--fg); color: var(--fg); font-weight: 400; }

.section { margin-top: 24px; }
.label { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
.labelrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.labelrow .label { margin: 0; }
.mini { display: flex; }

/* Segmented control: one hairline frame, the active half filled. */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--fg); border-radius: 10px; overflow: hidden; }
.seg button { font-size: 1rem; padding: 12px 8px; min-height: 48px; }
.seg button + button { border-left: 1px solid var(--fg); }
.seg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }

/* Script list: rows divided by hairlines, a radio mark for the selection. */
.scripts { border-top: 1px solid var(--line); }
.script { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 12px; width: 100%;
          min-height: 64px; padding: 10px 0; text-align: left; border-bottom: 1px solid var(--line); }
.script::before { content: ""; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--faint); }
.script.on::before { border-color: var(--fg); box-shadow: inset 0 0 0 4px var(--bg); background: var(--fg); }
.script > span:first-of-type { min-width: 0; }
.script .title { display: block; font-size: 1.05rem; }
.script.on .title { font-weight: 600; }
.script .sub { display: block; color: var(--muted); font-size: .85rem; margin-top: 1px; }
.script .kind { font-size: .85rem; white-space: nowrap; color: var(--muted); }
.kind.scam { color: var(--bad); }
.more { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-size: .95rem; min-height: 44px; }
.empty { color: var(--warn); font-size: .95rem; }
.toggle { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-top: 8px; }
.toggle > span:first-child { flex: 1; font-size: 1rem; }
.toggle span small { display: block; color: var(--muted); font-size: .85rem; }
.switch { flex: none; display: flex; }
.switch input { width: 22px; height: 22px; margin: 0; accent-color: var(--fg); }
.switch i { display: none; }

/* Call button: sticky at the thumb, green to call, red to hang up. */
.callzone { position: sticky; bottom: 0; z-index: 5; margin: 24px -16px 0;
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)); background: var(--bg); }
.bigbtn { width: 100%; min-height: 68px; border-radius: 14px; color: #fff; font-size: 1.35rem; font-weight: 600;
          display: flex; align-items: center; justify-content: center; gap: 12px; transition: background-color .12s; }
.bigbtn svg { width: 26px; height: 26px; }
.bigbtn.call { background: var(--ok); }
.bigbtn.call:active { background: var(--okd); }
.bigbtn.hang { background: var(--bad); }
.bigbtn.hang:active { background: var(--badd); }
.bigbtn:disabled { opacity: .5; }

details { margin-top: 20px; border-top: 1px solid var(--line); }
summary { padding: 14px 0; color: var(--muted); cursor: pointer; min-height: 48px; }
.adv { padding: 0 0 16px; display: grid; gap: 14px; }
.adv label { color: var(--muted); font-size: .9rem; display: grid; gap: 6px; }
.adv input, .adv select { font: inherit; font-size: 16px; color: var(--fg); background: #fff;
       border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.adv .check { display: flex; align-items: center; gap: 10px; color: var(--fg); }
.adv .check input { width: 22px; height: 22px; accent-color: var(--fg); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.keypad button { min-height: 52px; font-size: 1.3rem; font-variant-numeric: tabular-nums;
                 border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.keypad button:active { background: var(--line); }
pre { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
      font-size: 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
pre:empty { display: none; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }
.hint a { color: var(--fg); }
[hidden] { display: none !important; }
@media (min-width: 900px) { main { padding-top: 48px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1><span data-i18n="title"></span><small data-i18n="subtitle"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div class="statuszone">
    <div class="status" aria-live="polite">
      <span class="led" id="led"></span>
      <span><b id="statusText"></b><small id="statusSub"></small></span>
      <span class="timer" id="timer"></span>
    </div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div id="setup">
    <div class="section">
      <p class="label" data-i18n="source"></p>
      <div class="seg" role="group">
        <button type="button" id="srcScript" class="on" data-i18n="srcScript"></button>
        <button type="button" id="srcMic" data-i18n="srcMic"></button>
      </div>
    </div>

    <div class="section" id="scriptBox">
      <div class="labelrow">
        <p class="label" data-i18n="script"></p>
        <div class="mini" role="group" aria-label="Script language">
          <button type="button" data-slang="pl">PL</button><button type="button" data-slang="en">EN</button>
        </div>
      </div>
      <div class="scripts" id="scripts"></div>
      <button type="button" class="more" id="more"></button>
      <p class="empty" id="noSamples" hidden data-i18n="noSamples"></p>
      <label class="toggle">
        <span><span data-i18n="monitor"></span><small data-i18n="monitorHint"></small></span>
        <span class="switch"><input type="checkbox" id="monitor"><i></i></span>
      </label>
    </div>
    <p class="hint section" id="micHint" hidden data-i18n="micHint"></p>
  </div>

  <div class="callzone">
    <button type="button" id="call" class="bigbtn call">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.570a1 1 0 0 1-.25 1z"/></svg>
      <span data-i18n="call"></span>
    </button>
    <button type="button" id="hangup" class="bigbtn hang" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.870 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.77 7.46 7 12 7s8.66 1.77 11.71 4.670a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02 11.3 11.3 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
      <span data-i18n="hangup"></span>
    </button>
  </div>

  <details>
    <summary data-i18n="advanced"></summary>
    <div class="adv">
      <label><span data-i18n="callerNo"></span><input id="caller" value="+48500000001" autocomplete="off" inputmode="tel"></label>
      <label><span data-i18n="callLang"></span>
        <select id="lang"><option value="" data-i18n="langAuto"></option><option value="pl">pl</option><option value="en">en</option></select>
      </label>
      <label class="check"><input id="mute" type="checkbox"><span data-i18n="mute"></span></label>
      <p class="hint" data-i18n="keypadHint"></p>
      <div class="keypad" id="keypad"></div>
      <p class="hint"><span data-i18n="otherPages"></span> <a href="/dev/senior" target="_blank">/dev/senior</a>,
        <a href="/dev/jury" target="_blank">/dev/jury</a>, <a href="/dev/" target="_blank">/dev/</a></p>
      <pre id="log"></pre>
    </div>
  </details>
</main>
<script type="module">
import { base64ToBytes, bytesToBase64, makeLogger, mulawDecode, mulawEncode, setAudioSession,
         startAudio, unlockAudio, wsBase } from "/dev/static/audio.js";

const $ = (id) => document.getElementById(id);
const log = makeLogger($("log"));

// ---- i18n -------------------------------------------------------------------------------
const T = {
  pl: {
    title: "Symulator sieci operatora", subtitle: "Dzwonisz z nieznanego numeru do chronionego seniora",
    source: "Źródło dźwięku", srcScript: "Nagrany skrypt", srcMic: "Mikrofon na żywo", script: "Skrypt rozmowy",
    noSamples: "Brak nagrań na serwerze: uruchom server/scripts/make_samples.sh",
    monitor: "Odsłuch skryptu na tym telefonie", monitorHint: "Domyślnie wyłączony (bez echa przy drugim telefonie)",
    micHint: "Mów do mikrofonu. Trzymaj ten telefon z dala od telefonu seniora, żeby nie było echa.",
    call: "Zadzwoń", hangup: "Rozłącz", advanced: "Zaawansowane",
    callerNo: "Numer dzwoniącego", callLang: "Język rozmowy", langAuto: "automatycznie (ze skryptu / z interfejsu)",
    mute: "Wycisz głos seniora na tym telefonie", keypadHint: "Klawiatura (DTMF dzwoniącego, np. hasło rodzinne):",
    otherPages: "Inne strony:",
    idle: "Gotowy", idleSub: "Wybierz skrypt i naciśnij Zadzwoń", connecting: "Łączenie…",
    connectingSub: "Sieć operatora zestawia połączenie", ringing: "Dzwoni…",
    ringingSub: "Czekamy, aż senior odbierze", live: "Rozmowa trwa",
    liveScript: "Odtwarzamy skrypt: {name}", liveMic: "Mówisz przez mikrofon", scriptDone: "Skrypt zakończony, linia otwarta",
    ended: "Rozmowa zakończona", endedYou: "Rozłączyłeś się", endedNet: "Połączenie przerwane po stronie sieci", endedPeer: "Rozmówca się rozłączył",
    cutBanner: "Rozmowa przerwana przez ochronę Sprawdzam. Senior jest bezpieczny.",
    rejected: "Połączenie odrzucone", error: "Błąd", micError: "Brak dostępu do mikrofonu (wymaga HTTPS i zgody)",
    trusted: "Numer z kontaktów: rozmowa nie jest analizowana",
    notice: "Prawdziwy dzwoniący słyszy teraz: „{text}”",
    sPolice: "Na policjanta", sPoliceSub: "Fałszywa policjantka, gotówka, tajemnica",
    sGrand: "Na wnuczka", sGrandSub: "Wypadek, kaucja w gotówce, „nie mów nikomu”",
    sNormal: "Zwykła rozmowa", sNormalSub: "Wnuczka dziękuje za prezent, oddaje pożyczkę",
    sBank: "Na pracownika banku", sBankSub: "Bezpieczne konto, kod z SMS-a",
    sFamily: "Rozmowa rodzinna", sFamilySub: "Krótka zwykła rozmowa",
    scam: "oszustwo", normal: "zwykła", other: "inne", more: "Więcej skryptów", less: "Mniej skryptów",
  },
  en: {
    title: "Operator network simulator", subtitle: "You call a protected senior from an unknown number",
    source: "Audio source", srcScript: "Recorded script", srcMic: "Live microphone", script: "Call script",
    noSamples: "No recordings on the server: run server/scripts/make_samples.sh",
    monitor: "Play the script on this phone", monitorHint: "Off by default (no echo with the other phone nearby)",
    micHint: "Speak into the microphone. Keep this phone away from the senior's phone to avoid echo.",
    call: "Call", hangup: "Hang up", advanced: "Advanced",
    callerNo: "Caller number", callLang: "Call language", langAuto: "automatic (from the script / the UI)",
    mute: "Mute the senior's voice on this phone", keypadHint: "Keypad (caller DTMF, e.g. the family password):",
    otherPages: "Other pages:",
    idle: "Ready", idleSub: "Pick a script and press Call", connecting: "Connecting…",
    connectingSub: "The operator network is setting up the call", ringing: "Ringing…",
    ringingSub: "Waiting for the senior to answer", live: "In call",
    liveScript: "Playing the script: {name}", liveMic: "You are speaking through the microphone",
    scriptDone: "Script finished, line still open",
    ended: "Call ended", endedYou: "You hung up", endedNet: "Disconnected by the network", endedPeer: "The other side hung up",
    cutBanner: "Call cut off by Sprawdzam protection. The senior is safe.",
    rejected: "Call rejected", error: "Error", micError: "No microphone access (needs HTTPS and permission)",
    trusted: "Number is a contact: the call is not analysed",
    notice: "A real caller now hears: “{text}”",
    sPolice: "Fake police officer", sPoliceSub: "Fake detective, cash handover, secrecy",
    sGrand: "Grandchild in trouble", sGrandSub: "Accident, bail in cash, “don't tell anyone”",
    sNormal: "Normal call", sNormalSub: "Granddaughter thanks for a gift, pays back a loan",
    sBank: "Fake bank employee", sBankSub: "Safe account, SMS code",
    sFamily: "Family call", sFamilySub: "Short normal conversation",
    scam: "scam", normal: "normal", other: "other", more: "More scripts", less: "Fewer scripts",
  },
};
const SCRIPT_META = {
  scam_police: { key: "sPolice", kind: "scam", order: 1 },
  scam_grandchild: { key: "sGrand", kind: "scam", order: 2 },
  normal_grandchild: { key: "sNormal", kind: "normal", order: 3 },
  scam_bank: { key: "sBank", kind: "scam", order: 4 },
  normal_family: { key: "sFamily", kind: "normal", order: 5 },
};
let ui = "pl";
try { ui = localStorage.getItem("callerLang") || "pl"; } catch {}
if (!T[ui]) ui = "pl";
const t = (key, vars = {}) => (T[ui][key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function applyLang() {
  document.documentElement.lang = ui;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === ui));
  renderScripts();
  renderStatus();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => {
  ui = b.dataset.lang;
  try { localStorage.setItem("callerLang", ui); } catch {}
  // The script language follows the UI language (it can still be switched separately).
  const sl = document.querySelector(`[data-slang="${ui}"]`);
  if (sl) sl.click();
  applyLang();
});

// ---- scripts / source -------------------------------------------------------------------
let samples = [];
let selected = null;
let useMic = false;
let scriptLang = ui;
let showMore = false;

function scriptMeta(name) {
  const meta = SCRIPT_META[name.slice(3)];
  return meta || { key: null, kind: "other", order: 99 };
}

function renderScripts() {
  const box = $("scripts");
  box.textContent = "";
  document.querySelectorAll("[data-slang]").forEach((b) => b.classList.toggle("on", b.dataset.slang === scriptLang));
  const inLang = samples.filter((s) => s.lang === scriptLang);
  const extras = inLang.filter((s) => scriptMeta(s.name).order > 3);
  $("more").hidden = !extras.length;
  $("more").textContent = showMore ? t("less") : `${t("more")} (${extras.length})`;
  for (const s of inLang) {
    const meta = scriptMeta(s.name);
    if (meta.order > 3 && !showMore && s.name !== selected) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "script" + (s.name === selected ? " on" : "");
    b.setAttribute("aria-pressed", String(s.name === selected));
    const text = document.createElement("span");
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = meta.key ? t(meta.key) : s.name;
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = `${meta.key ? t(meta.key + "Sub") + " · " : ""}${Math.round(s.seconds)} s`;
    text.append(title, sub);
    const kind = document.createElement("span");
    kind.className = `kind ${meta.kind}`;
    kind.textContent = t(meta.kind);
    b.append(text, kind);
    b.onclick = () => {
      selected = s.name;
      try { localStorage.setItem("callerScript", selected); } catch {}
      renderScripts();
    };
    box.append(b);
  }
  $("noSamples").hidden = samples.length > 0;
}

function setSource(mic) {
  useMic = mic;
  $("srcMic").classList.toggle("on", mic);
  $("srcScript").classList.toggle("on", !mic);
  $("scriptBox").hidden = mic;
  $("micHint").hidden = !mic;
}
$("srcScript").onclick = () => setSource(false);
$("more").onclick = () => { showMore = !showMore; renderScripts(); };
document.querySelectorAll("[data-slang]").forEach((b) => b.onclick = () => {
  scriptLang = b.dataset.slang;
  const main = `${scriptLang}_scam_police`;
  if (!selected || !selected.startsWith(scriptLang + "_")) {
    selected = samples.some((s) => s.name === main) ? main
      : (samples.find((s) => s.lang === scriptLang) || {}).name || null;
  }
  renderScripts();
});
$("srcMic").onclick = () => setSource(true);

async function loadSamples() {
  try {
    const res = await fetch("/dev/samples", { cache: "no-store" });
    const data = await res.json();
    // Demo scripts first (police, grandchild, normal), in the UI language, then the other one.
    samples = data.samples.slice().sort((a, b) =>
      scriptMeta(a.name).order - scriptMeta(b.name).order || a.name.localeCompare(b.name));
    let saved = null;
    try { saved = localStorage.getItem("callerScript"); } catch {}
    const names = samples.map((s) => s.name);
    selected = names.includes(saved) ? saved
      : names.includes(`${ui}_scam_police`) ? `${ui}_scam_police` : names[0] || null;
    if (selected) scriptLang = selected.slice(0, 2);
    renderScripts();
  } catch (err) {
    log(`could not list samples: ${err.message}`);
    $("noSamples").hidden = false;
  }
}

// ---- status -----------------------------------------------------------------------------
let state = "idle";            // idle | connecting | ringing | live | ended
let statusSub = null;          // [key, vars] or a plain string
let callStart = 0, timerHandle = null, endedByUser = false;

function setState(next, sub = null) {
  state = next;
  statusSub = sub;
  renderStatus();
  log(`${next}${sub ? ": " + (Array.isArray(sub) ? t(sub[0], sub[1]) : sub) : ""}`);
}

function renderStatus() {
  $("statusText").textContent = t(state);
  const defaultSub = { idle: "idleSub", connecting: "connectingSub", ringing: "ringingSub" }[state];
  const sub = statusSub || (defaultSub ? [defaultSub] : "");
  $("statusSub").textContent = Array.isArray(sub) ? t(sub[0], sub[1]) : sub;
  $("led").className = "led " + ({ ringing: "ringing", connecting: "ringing", live: "live", ended: "ended" }[state] || "");
  const inCall = state === "connecting" || state === "ringing" || state === "live";
  $("call").hidden = inCall;
  $("hangup").hidden = !inCall;
  $("setup").hidden = inCall;
}

function startTimer() {
  callStart = performance.now();
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    const s = Math.floor((performance.now() - callStart) / 1000);
    $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 250);
}

function showBanner(text, info = false) {
  $("banner").textContent = text;
  $("banner").className = info ? "banner info" : "banner";
  $("banner").hidden = !text;
}

// ---- call (Twilio Media Streams format) -------------------------------------------------
const ACCOUNT = "AC" + "0".repeat(32);
const SILENCE = new Uint8Array(160).fill(0xff);
let ws = null, audio = null, streamSid = null, callId = null, seq = 0, chunk = 0, t0 = 0;
let sample = null, samplePos = 0, sampleTimer = null, answered = false, wakeLock = null;
let prompts = 0;  // backend prompts (warning, password question) played to the caller

const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))]
  .map((b) => b.toString(16).padStart(2, "0")).join("");
const send = (obj) => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ sequenceNumber: String(++seq), ...obj }));
  }
};

function sendMulaw(bytes) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  chunk += 1;
  send({ event: "media", streamSid, media: {
    track: "inbound", chunk: String(chunk), timestamp: String(Math.round(performance.now() - t0)),
    payload: bytesToBase64(bytes) } });
}

// Microphone mode: 20 ms frames at 8 kHz (resampled from the device rate in the worklet).
const sendFrame = (samples) => sendMulaw(mulawEncode(samples));

// Script mode: silence until the senior answers (first `clear`), then the clip in real
// time, then silence so the call stays open until someone hangs up.
function nextSampleFrame() {
  if (!answered || !sample || samplePos >= sample.length) return SILENCE;
  const frame = new Uint8Array(160).fill(0xff);
  frame.set(sample.subarray(samplePos, samplePos + 160));
  samplePos += 160;
  if (audio && $("monitor").checked) audio.monitor(mulawDecode(frame));
  if (samplePos >= sample.length) setState("live", ["scriptDone"]);
  return frame;
}

function startSampleClock() {
  const start = performance.now();
  let sent = 0;
  sampleTimer = setInterval(() => {
    const due = Math.floor((performance.now() - start) / 20);
    // After a stall (e.g. the screen locked) skip ahead instead of sending a burst.
    if (due - sent > 50) sent = due - 1;
    while (sent < due) { sendMulaw(nextSampleFrame()); sent += 1; }
  }, 20);
}

function onServerMessage(msg) {
  if (msg.event === "media") {
    if (audio && !$("mute").checked) audio.play(mulawDecode(base64ToBytes(msg.media.payload)));
  } else if (msg.event === "clear") {
    if (audio) audio.clear();
    if (!answered) {
      answered = true;
      startTimer();
      const meta = sample ? scriptMeta(selected) : null;
      setState("live", sample ? ["liveScript", { name: meta.key ? t(meta.key) : selected }] : ["liveMic"]);
    } else {
      prompts += 1;
      log("clear (a backend prompt starts)");
    }
  } else if (msg.event === "mark") {
    send({ event: "mark", streamSid, mark: { name: msg.mark.name } });
  }
}

async function cleanup() {
  clearInterval(sampleTimer);
  sampleTimer = null;
  clearInterval(timerHandle);
  if (wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }
  if (audio) { const a = audio; audio = null; await a.stop(); }
  ws = null;
}

$("call").onclick = async () => {
  // iOS: the AudioContext must be created and resumed synchronously in the tap handler.
  // Script mode: "playback" also plays with the ringer switch on silent (iOS 17+). Microphone
  // mode keeps Safari's default routing for calls with getUserMedia.
  setAudioSession(useMic ? "auto" : "playback");
  let ctx = null;
  try { ctx = unlockAudio(); } catch (err) { log(`audio unlock failed: ${err.message}`); }
  showBanner("");
  $("timer").textContent = "";
  endedByUser = false;
  answered = false;
  prompts = 0;
  setState("connecting");
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  try {
    const source = useMic ? null : selected;
    if (!useMic && !source) throw new Error(t("noSamples"));
    sample = null; samplePos = 0;
    if (source) {
      const res = await fetch(`/dev/samples/${encodeURIComponent(source)}.ulaw`, { cache: "no-store" });
      if (!res.ok) throw new Error(`sample ${source}: HTTP ${res.status}`);
      sample = new Uint8Array(await res.arrayBuffer());
    }
    const lang = $("lang").value || (source ? source.slice(0, 2) : ui);
    const res = await fetch("/dev/calls", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ caller: $("caller").value.trim(), lang }),
    });
    const data = await res.json();
    if (!res.ok) {
      setState("ended", `${t("rejected")} (${res.status} ${data.reason || data.error || ""})`);
      if (data.message) showBanner(data.message, true);
      if (ctx) ctx.close().catch(() => {});
      await cleanup();
      return;
    }
    callId = data.callId;
    streamSid = "MZ" + hex(16);
    seq = 0; chunk = 0;
    log(`call ${callId} admitted (${data.lang})`);
    if (data.trusted) showBanner(t("trusted"), true);
    else log(t("notice", { text: data.notice }));
    try {
      audio = await startAudio({ targetRate: 8000, frameSamples: 160, onFrame: sendFrame,
                                 mic: !sample, ctx, monitor: !!sample });
      log(`audio context ${audio.sampleRate} Hz`);
    } catch (err) {
      if (!sample) throw new Error(`${t("micError")}: ${err.message}`);
      log(`audio output unavailable: ${err.message}`);
    }
    ws = new WebSocket(wsBase() + data.streamPath);
    ws.onopen = () => {
      send({ event: "connected", protocol: "Call", version: "1.0.0" });
      send({ event: "start", streamSid, start: {
        accountSid: ACCOUNT, streamSid, callSid: callId, tracks: ["inbound"],
        customParameters: { token: data.token, lang: data.lang, callId },
        mediaFormat: { encoding: "audio/x-mulaw", sampleRate: 8000, channels: 1 } } });
      t0 = performance.now();
      if (sample) startSampleClock();
      setState("ringing");
    };
    ws.onmessage = (event) => onServerMessage(JSON.parse(event.data));
    ws.onerror = () => log("websocket error");
    ws.onclose = (event) => {
      const byNetwork = !endedByUser;
      // The backend closes the stream when protection hangs up on a scam (after its warning
      // prompts) or when the senior hangs up (usually without any prompt).
      const cut = byNetwork && answered && prompts > 0;
      setState("ended", !byNetwork ? ["endedYou"] : cut ? `${t("endedNet")} (${event.code})` : ["endedPeer"]);
      if (cut) showBanner(t("cutBanner"));
      cleanup();
    };
  } catch (err) {
    setState("ended", `${t("error")}: ${err.message}`);
    if (ctx && !audio) ctx.close().catch(() => {});
    cleanup();
  }
};

$("hangup").onclick = () => {
  endedByUser = true;
  send({ event: "stop", streamSid, stop: { accountSid: ACCOUNT, callSid: callId } });
  if (ws) ws.close();
  else { setState("ended", ["endedYou"]); cleanup(); }
};

for (const digit of "123456789*0#") {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = digit;
  button.onclick = () => send({ event: "dtmf", streamSid, dtmf: { track: "inbound_track", digit } });
  $("keypad").append(button);
}

setSource(false);
applyLang();
loadSamples();
</script>
</body>
</html>
