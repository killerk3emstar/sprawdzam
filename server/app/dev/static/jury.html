<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F7F5">
<title>Sprawdzam console</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --bg: #F7F7F5; --fg: #111; --muted: #6A6A66; --faint: #A3A39E; --line: #DCDCD7;
  --bad: #C0261A; --warn: #A15C00; --ok: #1F7A3D;
}
* { box-sizing: border-box; }
html { font-size: clamp(14px, 1.04vw, 22px); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 1rem/1.4 var(--font); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
       -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Header: name, tabs, connection, language. */
header { display: flex; align-items: baseline; gap: 2.4rem; padding: 1.3rem 2.4rem 1rem; border-bottom: 1px solid var(--line); }
.brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
nav { display: flex; gap: 1.6rem; }
nav button { color: var(--muted); font-size: 1rem; padding: .15rem 0; border-bottom: 2px solid transparent; }
nav button.on { color: var(--fg); border-bottom-color: var(--fg); }
.spacer { flex: 1; }
.conn { color: var(--muted); font-size: .85rem; }
.conn.offline { color: var(--bad); }
.lang { display: flex; gap: .8rem; font-size: .85rem; }
.lang button { color: var(--faint); }
.lang button.on { color: var(--fg); font-weight: 600; }

main { min-height: 0; padding: 1.8rem 2.4rem 1.2rem; }
.tab { height: 100%; min-height: 0; }
h2 { font-size: .85rem; font-weight: 500; color: var(--muted); margin: 0 0 .6rem; }

/* Live tab: verdict column (score, chart, reasons, actions) and transcript column. */
#live { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 3.2rem; }
.verdict { display: grid; grid-template-rows: auto auto auto minmax(6rem, 1fr) auto; min-height: 0; }
.callinfo { display: flex; align-items: baseline; gap: 1.2rem; font-size: 1.05rem; color: var(--muted); }
.callinfo .who { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.callinfo .callstate { font-size: 1.05rem; font-weight: 400; color: var(--muted); margin-right: 1rem; letter-spacing: 0; }
.callinfo .timer { margin-left: auto; color: var(--fg); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.score { font-size: 11.5rem; line-height: .86; font-weight: 700; letter-spacing: -.055em; margin: 1.6rem 0 .9rem -.06em;
         font-variant-numeric: tabular-nums; }
.score.idle { color: var(--line); font-weight: 300; }
.score.warn, .state.warn { color: var(--warn); }
.score.high, .state.high { color: var(--bad); }
.state { font-size: 1.7rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.state.idle { color: var(--muted); font-weight: 500; }
.pattern { font-size: 1.15rem; color: var(--muted); margin-top: .3rem; min-height: 1.6rem; }
.pattern b { color: var(--fg); font-weight: 600; }
.chartbox { min-height: 0; display: flex; flex-direction: column; margin-top: 1.6rem; }
.chartbox svg { flex: 1; min-height: 0; width: 100%; display: block; overflow: visible; }
.chartbox svg text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: 1fr 1.7fr; gap: 2rem; border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1rem; }
.facts ul { list-style: none; margin: 0; padding: 0; font-size: 1.1rem; line-height: 1.35; }
.facts li + li { margin-top: .35rem; }
.reasons li { color: var(--fg); }
.facts .none { color: var(--faint); }
.acts li { display: grid; grid-template-columns: 3rem 1fr; gap: .8rem; }
.acts .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.acts .warn { color: var(--warn); } .acts .bad { color: var(--bad); } .acts .ok { color: var(--ok); }
.acts .detail { display: block; color: var(--muted); font-size: .85rem; }
.facts .scroll { max-height: 11.5rem; overflow-y: auto; }

.transcript { border-left: 1px solid var(--line); padding-left: 3.2rem; display: flex; flex-direction: column; min-height: 0; }
.lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; padding: 0 .4rem 1rem 0; scrollbar-width: none; }
.lines::-webkit-scrollbar { display: none; }
.line { max-width: 40em; }
.line .who { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .2rem; }
.line .who span { color: var(--faint); margin-left: .6rem; font-variant-numeric: tabular-nums; }
.line p { margin: 0; font-size: 1.45rem; line-height: 1.38; letter-spacing: -.005em; }
.line.senior { margin-left: 4.5rem; padding-left: 1.2rem; border-left: 2px solid var(--fg); }
.line.senior p { font-weight: 500; }
.empty { margin: .4rem 0 0; color: var(--muted); font-size: 1.4rem; }
.empty span { display: block; color: var(--faint); font-size: 1rem; margin-top: .3rem; }

/* Operator tab. */
#operator { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding-bottom: 1.6rem; }
.totals div { padding-right: 2rem; }
.totals b { display: block; font-size: 4.4rem; line-height: 1; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.totals span { display: block; color: var(--muted); font-size: 1rem; margin-top: .5rem; }
.totals .warn b { color: var(--warn); } .totals .bad b { color: var(--bad); }
.privacy { color: var(--muted); font-size: .95rem; margin: 1.2rem 0 .4rem; }
.tablebox { overflow: auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; font-size: 1.1rem; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: .85rem; padding: .7rem 1.4rem .6rem 0;
     border-bottom: 1px solid var(--fg); position: sticky; top: 0; background: var(--bg); white-space: nowrap; }
td { padding: .85rem 1.4rem .85rem 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.tn { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.dim { color: var(--muted); }
td .warned { color: var(--warn); font-weight: 600; } td .blocked { color: var(--bad); font-weight: 600; }
td .normal { color: var(--muted); }
td.acts-cell { color: var(--muted); font-size: 1rem; }
.noalerts { color: var(--muted); padding: 1.2rem 0; margin: 0; }

footer { padding: .7rem 2.4rem .9rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }

@media (max-width: 1000px) {
  body { overflow: auto; height: auto; }
  header { flex-wrap: wrap; gap: 1rem 1.6rem; padding: 1rem; }
  main { padding: 1rem; }
  #live { grid-template-columns: 1fr; gap: 2rem; }
  .verdict { grid-template-rows: auto; }
  .chartbox { height: 220px; }
  .transcript { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 1.2rem; }
  .lines { max-height: 60vh; }
  .score { font-size: 8rem; }
  .totals { grid-template-columns: repeat(2, 1fr); gap: 1.2rem 0; }
  .tablebox { overflow-x: auto; }
  footer { padding: .7rem 1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">Sprawdzam</div>
  <nav>
    <button type="button" data-tab="live" class="on" data-i18n="tabLive"></button>
    <button type="button" data-tab="operator" data-i18n="tabOperator"></button>
  </nav>
  <div class="spacer"></div>
  <div class="conn" id="conn"><span id="connText"></span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div>
</header>

<main>
  <section class="tab" id="live">
    <div class="verdict">
      <div class="callinfo">
        <span class="who" id="callNum">—</span>
        <span id="callMeta"></span>
        <span class="timer"><span class="callstate" id="callState"></span><span id="callTimer">0:00</span></span>
      </div>
      <div>
        <div class="score idle" id="score" aria-live="polite">–</div>
        <div class="state idle" id="level"></div>
        <div class="pattern" id="pattern"></div>
      </div>
      <div></div>
      <div class="chartbox">
        <h2 id="chartTitle"></h2>
        <svg id="chart" role="img"></svg>
      </div>
      <div class="facts">
        <div><h2 data-i18n="reasons"></h2><ul class="reasons scroll" id="chips"></ul></div>
        <div><h2 data-i18n="actions"></h2><ul class="acts scroll" id="acts"></ul></div>
      </div>
    </div>
    <div class="transcript">
      <h2 data-i18n="transcript"></h2>
      <div class="lines" id="lines"></div>
    </div>
  </section>

  <section class="tab" id="operator" hidden>
    <div class="totals">
      <div><b id="tCalls">0</b><span data-i18n="tCalls"></span></div>
      <div class="warn"><b id="tWarned">0</b><span data-i18n="tWarned"></span></div>
      <div class="bad"><b id="tBlocked">0</b><span data-i18n="tBlocked"></span></div>
      <div><b id="tNormal">0</b><span data-i18n="tNormal"></span></div>
    </div>
    <p class="privacy" data-i18n="privacy"></p>
    <div class="tablebox">
      <table>
        <thead><tr><th data-i18n="cTime"></th><th data-i18n="cNumber"></th><th data-i18n="cType"></th><th class="n" data-i18n="cMax"></th><th data-i18n="cOutcome"></th><th data-i18n="cActions"></th></tr></thead>
        <tbody id="alerts"></tbody>
      </table>
      <p class="noalerts" id="noAlerts" data-i18n="noAlerts"></p>
    </div>
  </section>
</main>

<footer data-i18n="disclaimer"></footer>

<script type="module">
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const MOCK = params.get("mock") === "1";

// ---- i18n -------------------------------------------------------------------------------
const T = {
  pl: {
    tabLive: "Na żywo", tabOperator: "Panel operatora",
    transcript: "Rozmowa", chart: "Ryzyko w czasie", reasons: "Powody", actions: "Działania",
    caller: "Dzwoniący", senior: "Senior",
    waitTitle: "Czekamy na połączenie", waitSub: "Zadzwoń z symulatora sieci operatora.",
    live: "Rozmowa trwa", listening: "Słuchamy rozmowy…",
    lvlNone: "Bez oznak oszustwa", lvlWarn: "Ostrzeżenie", lvlHigh: "Wysokie ryzyko", lvlIdle: "Czekamy na połączenie",
    lvlAnalysing: "Analiza rozmowy…", stBlocked: "Rozłączono — oszustwo", stEnded: "Zakończona",
    pattern: "Wzorzec:", srcModel: "model AI i reguły", srcRules: "tylko reguły (model niedostępny)",
    warnLine: "ostrzeżenie", hangLine: "rozłączenie",
    noReasons: "Brak", noActions: "Brak: rozmowa wygląda normalnie", noCall: "—",
    connLive: "Połączono z serwerem", connOff: "Brak połączenia z serwerem, ponawiam…", connWait: "Łączenie…", connMock: "Tryb demo, dane symulowane",
    tCalls: "Przeanalizowane rozmowy", tWarned: "Ostrzeżenia", tBlocked: "Zablokowane oszustwa", tNormal: "Bez zagrożenia",
    privacy: "Operator widzi tylko metadane alertów. Treść rozmów i nagrania nie są przechowywane ani pokazywane.",
    cTime: "Czas", cNumber: "Numer", cType: "Typ oszustwa", cMax: "Maks. ryzyko", cOutcome: "Wynik", cActions: "Działania",
    noAlerts: "Brak alertów.",
    disclaimer: "Tryb demonstracyjny. W produkcji treść rozmów nie jest wyświetlana.",
    langPl: "polski", langEn: "angielski", unknownNo: "numer ukryty",
  },
  en: {
    tabLive: "Live", tabOperator: "Operator console",
    transcript: "Conversation", chart: "Risk over time", reasons: "Reasons", actions: "Actions",
    caller: "Caller", senior: "Senior",
    waitTitle: "Waiting for a call", waitSub: "Call from the operator network simulator.",
    live: "In call", listening: "Listening to the call…",
    lvlNone: "No signs of fraud", lvlWarn: "Warning", lvlHigh: "High risk", lvlIdle: "Waiting for a call",
    lvlAnalysing: "Analysing the call…", stBlocked: "Cut off — scam", stEnded: "Ended",
    pattern: "Pattern:", srcModel: "AI model and rules", srcRules: "rules only (model unavailable)",
    warnLine: "warning", hangLine: "cut-off",
    noReasons: "None", noActions: "None: the call looks normal", noCall: "—",
    connLive: "Connected to the server", connOff: "Server disconnected, retrying…", connWait: "Connecting…", connMock: "Demo mode, simulated data",
    tCalls: "Calls analysed", tWarned: "Warnings", tBlocked: "Scams blocked", tNormal: "No threat",
    privacy: "The operator only sees alert metadata. Call content and audio are never stored or shown.",
    cTime: "Time", cNumber: "Number", cType: "Scam type", cMax: "Max risk", cOutcome: "Outcome", cActions: "Actions",
    noAlerts: "No alerts yet.",
    disclaimer: "Demo mode. In production, call content is never displayed.",
    langPl: "Polish", langEn: "English", unknownNo: "hidden number",
  },
};
const LABELS = {
  reason: {
    money: ["Prośba o pieniądze", "Asks for money"], secrecy: ["Nakaz zachowania tajemnicy", "Demands secrecy"],
    authority: ["Podszywanie się pod instytucję", "Impersonates an authority"],
    urgency: ["Presja czasu", "Time pressure"], rules: ["Słowa kluczowe", "Keywords"],
    keywords: ["Słowa kluczowe", "Keywords"], blik: ["Kod BLIK", "BLIK code"],
    remote_access: ["Zdalny dostęp do telefonu", "Remote access"], cash: ["Gotówka", "Cash"],
    transfer: ["Przelew", "Bank transfer"], password: ["Hasło lub kod", "Password or code"],
  },
  scam: {
    none: ["brak", "none"], grandchild: ["na wnuczka", "grandchild scam"], police: ["na policjanta", "fake police"],
    bank: ["na pracownika banku", "fake bank employee"], other: ["inne oszustwo", "other fraud"],
  },
  // [PL, EN, tone] where tone colours the line: warn | bad | ok | "" (neutral).
  action: {
    warn: ["Ostrzeżenie głosowe dla seniora", "Voice warning to the senior", "warn"],
    verify_password: ["Pytanie o hasło rodzinne", "Family password challenge", ""],
    password_ok: ["Hasło rodzinne poprawne", "Family password correct", "ok"],
    password_failed: ["Hasło rodzinne błędne", "Wrong family password", "bad"],
    confirm_block: ["Blokada za kilka sekund (brak hasła rodzinnego)", "Blocking in a few seconds (no family password)", "warn"],
    senior_blocked: ["Senior rozłączył podejrzaną rozmowę", "The senior hung up the suspicious call", "bad"],
    hangup: ["Rozłączenie rozmowy", "Call cut off", "bad"],
    sms_requested: ["SMS do osoby zaufanej: wysyłanie…", "SMS to the trusted person: sending…", ""],
    sms_sent: ["SMS do osoby zaufanej wysłany", "SMS to the trusted person sent", "ok"],
    sms_failed: ["SMS do osoby zaufanej: błąd", "SMS to the trusted person failed", "bad"],
    fail_open: ["Ochrona niedostępna, połączenie przepuszczone", "Protection unavailable, call let through", "warn"],
  },
  short: {
    warn: ["ostrzeżenie", "warning"], verify_password: ["hasło rodzinne", "family password"],
    password_ok: ["hasło poprawne", "password OK"], password_failed: ["złe hasło", "wrong password"],
    confirm_block: ["blokada", "auto-block"], senior_blocked: ["rozłączył senior", "senior hung up"],
    hangup: ["rozłączenie", "cut off"], sms_requested: ["SMS", "SMS"], sms_sent: ["SMS wysłany", "SMS sent"],
    sms_failed: ["SMS: błąd", "SMS failed"], fail_open: ["przepuszczone", "let through"],
  },
  outcome: { warned: ["ostrzeżono", "warned"], blocked: ["zablokowano", "blocked"], normal: ["bez zagrożenia", "no threat"] },
  reason_end: {
    scam_blocked: ["oszustwo zablokowane", "scam blocked"], caller_hangup: ["dzwoniący się rozłączył", "caller hung up"],
    senior_hangup: ["senior się rozłączył", "senior hung up"], app_hangup: ["senior się rozłączył", "senior hung up"],
    senior_blocked: ["senior rozłączył podejrzaną rozmowę", "senior hung up the suspicious call"],
    password_ok: ["hasło poprawne", "password correct"], timeout: ["limit czasu", "timed out"], error: ["błąd", "error"],
  },
};
// Details worth showing under an action (the others are developer strings).
const SHOW_DETAIL = new Set(["sms_sent", "sms_failed", "confirm_block", "fail_open"]);
const BLOCK_ACTIONS = new Set(["hangup", "senior_blocked"]);

let ui = "pl";
try { ui = localStorage.getItem("juryLang") || "pl"; } catch {}
if (!T[ui]) ui = "pl";
const t = (k) => T[ui][k] ?? k;
const L = (group, key) => {
  const v = LABELS[group][key];
  return v ? v[ui === "pl" ? 0 : 1] : String(key || "").replace(/_/g, " ");
};

// ---- state ------------------------------------------------------------------------------
let thresholds = { warn: 50, hangup: 90 };
let call = null;          // { id, caller, lang, start (ms), ended, reason, lines[], risks[], actions[], last }
let alerts = [];          // newest first
let endedNoAlert = 0;     // analysed calls that produced no alert record

function newCall(m) {
  return { id: m.callId, caller: m.caller, lang: m.lang, start: Date.parse(m.at) || Date.now(),
           ended: false, reason: null, lines: [], risks: [], actions: [], last: null };
}
const offset = (at) => Math.max(0, ((Date.parse(at) || Date.now()) - call.start) / 1000);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const levelOf = (score) => score >= thresholds.hangup ? "high" : score >= thresholds.warn ? "warn" : "none";
const blocked = (c) => c && (c.reason === "scam_blocked" || c.reason === "senior_blocked"
  || c.actions.some((a) => BLOCK_ACTIONS.has(a.action)));

function handle(m) {
  switch (m.type) {
    case "hello":
      thresholds = { warn: m.warn ?? 50, hangup: m.hangup ?? 90 };
      alerts = (m.alerts || []).slice().sort((a, b) => (Date.parse(b.at) || 0) - (Date.parse(a.at) || 0));
      endedNoAlert = 0;
      renderAll();
      break;
    case "call_started":
      call = newCall(m);
      renderAll();
      break;
    case "transcript":
      if (!ensureCall(m)) return;
      call.lines.push({ speaker: m.speaker, text: m.text, t: offset(m.at) });
      renderLines(true);
      break;
    case "risk":
      if (!ensureCall(m)) return;
      call.last = m;
      call.risks.push({ t: offset(m.at), score: m.score, level: m.level });
      renderScore();
      renderChart();
      break;
    case "action":
      if (!ensureCall(m)) return;
      call.actions.push({ action: m.action, detail: m.detail, t: offset(m.at) });
      renderActions();
      renderScore();
      break;
    case "call_ended":
      if (m.alert) alerts.unshift(m.alert); else endedNoAlert += 1;
      if (call && call.id === m.callId) { call.ended = true; call.reason = m.reason; call.endT = offset(m.at); }
      renderAll();
      break;
  }
}

// Events of a call we missed the start of (page opened mid-call) start a call view too.
function ensureCall(m) {
  if (!call || (call.id !== m.callId && call.ended)) {
    call = newCall({ callId: m.callId, caller: "", lang: "", at: m.at });
    renderAll();
  }
  return call.id === m.callId;
}

// ---- rendering --------------------------------------------------------------------------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderAll() {
  renderCallbar(); renderLines(false); renderScore(); renderChart(); renderActions(); renderOperator();
}

function renderCallbar() {
  $("callNum").textContent = call ? (call.caller || t("unknownNo")) : t("noCall");
  $("callMeta").textContent = call && call.lang ? (call.lang === "pl" ? t("langPl") : t("langEn")) : "";
  $("callState").textContent = !call ? "" : call.ended ? t("stEnded") : t("live");
  tick();
}

function tick() {
  if (!call) { $("callTimer").textContent = "0:00"; return; }
  const s = call.ended ? (call.endT ?? 0) : (Date.now() - call.start) / 1000;
  $("callTimer").textContent = fmt(Math.max(0, s));
}
setInterval(tick, 500);

function renderLines(append) {
  const box = $("lines");
  if (!call || !call.lines.length) {
    box.textContent = "";
    const e = el("div", "empty", call ? t("listening") : t("waitTitle"));
    if (!call) e.append(el("span", "", t("waitSub")));
    box.append(e);
    return;
  }
  if (!append || box.querySelector(".empty")) box.textContent = "";
  const start = append ? box.children.length : 0;
  for (const line of call.lines.slice(start)) {
    const senior = line.speaker === "senior";
    const d = el("div", `line ${senior ? "senior" : "caller"}`);
    const who = el("span", "who", senior ? t("senior") : t("caller"));
    who.append(el("span", "", fmt(line.t)));
    d.append(who, el("p", "", line.text));
    box.append(d);
  }
  box.scrollTop = box.scrollHeight;
}

function renderScore() {
  const m = call && call.last;
  const sc = $("score"), lv = $("level"), pat = $("pattern"), list = $("chips");
  list.textContent = "";
  pat.textContent = "";
  $("chartTitle").textContent = t("chart") + (m ? `, ${m.source === "rules" ? t("srcRules") : t("srcModel")}` : "");
  if (!m) {
    sc.className = "score idle"; sc.textContent = "–";
    lv.className = "state idle"; lv.textContent = call ? t("lvlAnalysing") : t("lvlIdle");
    if (call && call.ended) { lv.className = "state"; lv.textContent = `${t("stEnded")}: ${L("reason_end", call.reason)}`; }
    list.append(el("li", "none", t("noReasons")));
    return;
  }
  const level = m.level || levelOf(m.score);
  const isBlocked = blocked(call);
  const tone = isBlocked ? "high" : level === "none" ? "" : level;
  sc.className = `score ${tone}`;
  sc.textContent = Math.round(m.score);
  lv.className = `state ${tone}`;
  if (isBlocked) lv.textContent = t("stBlocked");
  else if (call.ended) lv.textContent = `${t("stEnded")}: ${L("reason_end", call.reason)}`;
  else lv.textContent = { none: t("lvlNone"), warn: t("lvlWarn"), high: t("lvlHigh") }[level] || level;
  if (m.scamType && m.scamType !== "none") {
    pat.append(document.createTextNode(t("pattern") + " "), el("b", "", L("scam", m.scamType)));
  }
  for (const r of m.reasons || []) list.append(el("li", "", L("reason", r)));
  if (!list.children.length) list.append(el("li", "none", t("noReasons")));
}

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

// Drawn in CSS pixels of the element (no stretched viewBox), redrawn on resize.
function renderChart() {
  const c = $("chart");
  c.textContent = "";
  const W = Math.max(200, c.clientWidth), H = Math.max(80, c.clientHeight);
  c.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const small = Math.round(fs * 0.8);
  const padL = Math.round(fs * 2), padR = 2, padT = Math.round(fs * 0.4), padB = Math.round(fs * 1.5);
  const risks = call ? call.risks : [];
  const tMax = Math.max(60, ...risks.map((r) => r.t + 5), call && call.ended ? (call.endT || 0) : 0);
  const x = (s) => padL + (s / tMax) * (W - padL - padR);
  const y = (v) => padT + (1 - v / 100) * (H - padT - padB);
  const muted = "#6A6A66", faint = "#A3A39E", line = "#DCDCD7";
  for (const v of [0]) {
    c.append(svg("text", { x: padL - fs * 0.5, y: y(v) + small * 0.35, "text-anchor": "end", fill: faint, "font-size": small }, String(v)));
  }
  c.append(svg("line", { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: line, "stroke-width": 1 }));
  const step = tMax > 150 ? 60 : tMax > 90 ? 30 : 10;
  for (let s = 0; s <= tMax; s += step) {
    c.append(svg("text", { x: x(s), y: H - small * 0.2, "text-anchor": s === 0 ? "start" : "middle", fill: faint, "font-size": small }, `${s} s`));
  }
  for (const [v, label, color] of [[thresholds.warn, t("warnLine"), "#A15C00"], [thresholds.hangup, t("hangLine"), "#C0261A"]]) {
    c.append(svg("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: color, "stroke-width": 1 }));
    c.append(svg("text", { x: padL - fs * 0.5, y: y(v) + small * 0.35, "text-anchor": "end", fill: color, "font-size": small }, String(v)));
    c.append(svg("text", { x: W - padR, y: y(v) - small * 0.45, "text-anchor": "end", fill: color, "font-size": small }, label));
  }
  if (!risks.length) return;
  const pts = risks.map((r) => [x(r.t), y(r.score)]);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  c.append(svg("path", { d: path, fill: "none", stroke: "#111", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const last = pts[pts.length - 1];
  c.append(svg("circle", { cx: last[0], cy: last[1], r: 4, fill: "#111" }));
}
if (window.ResizeObserver) new ResizeObserver(() => renderChart()).observe($("chart"));

function renderActions() {
  const ul = $("acts");
  ul.textContent = "";
  if (!call || !call.actions.length) {
    ul.append(el("li", "none", call && call.last ? t("noActions") : t("noReasons")));
    return;
  }
  for (const a of call.actions) {
    const meta = LABELS.action[a.action] || [a.action, a.action, ""];
    const li = el("li");
    const text = el("span", meta[2], meta[ui === "pl" ? 0 : 1]);
    if (a.detail && SHOW_DETAIL.has(a.action)) text.append(el("span", "detail", a.detail));
    li.append(el("span", "t", fmt(a.t)), text);
    ul.append(li);
  }
  ul.scrollTop = ul.scrollHeight;
}

function renderOperator() {
  const count = (o) => alerts.filter((a) => a.outcome === o).length;
  $("tCalls").textContent = alerts.length + endedNoAlert;
  $("tWarned").textContent = count("warned");
  $("tBlocked").textContent = count("blocked");
  $("tNormal").textContent = count("normal") + endedNoAlert;
  const tb = $("alerts");
  tb.textContent = "";
  for (const a of alerts) {
    const tr = el("tr");
    const d = new Date(a.at);
    const today = !isNaN(d) && d.toDateString() === new Date().toDateString();
    tr.append(el("td", "tn", isNaN(d) ? "" : d.toLocaleString(ui === "pl" ? "pl-PL" : "en-GB",
      today ? { hour: "2-digit", minute: "2-digit", second: "2-digit" }
            : { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })));
    tr.append(el("td", "tn", a.caller || t("unknownNo")));
    const scam = a.scamType && a.scamType !== "none";
    tr.append(el("td", scam ? "" : "dim", scam ? L("scam", a.scamType) : "—"));
    tr.append(el("td", "n", String(Math.round(a.maxScore || 0))));
    const out = el("td"); out.append(el("span", a.outcome, L("outcome", a.outcome))); tr.append(out);
    tr.append(el("td", "acts-cell", (a.actions || []).map((x) => L("short", x)).join(", ") || "—"));
    tb.append(tr);
  }
  $("noAlerts").hidden = alerts.length > 0;
}

// ---- tabs / language ----------------------------------------------------------------------
function showTab(name) {
  document.querySelectorAll("nav button").forEach((b) => {
    b.classList.toggle("on", b.dataset.tab === name);

  });
  $("live").hidden = name !== "live";
  $("operator").hidden = name !== "operator";
  if (name === "live") renderChart();
}

// ---- connection ---------------------------------------------------------------------------
let connState = MOCK ? "mock" : "wait";
function setConn(state) {
  connState = state;
  $("conn").className = `conn ${state}`;
  $("connText").textContent = { live: t("connLive"), offline: t("connOff"), wait: t("connWait"), mock: t("connMock") }[state];
}

function connect(attempt = 0) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let ws;
  try { ws = new WebSocket(`${proto}://${location.host}/dev/events`); }
  catch { return retry(attempt); }
  let opened = false;
  ws.onopen = () => { opened = true; setConn("live"); };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (err) { console.warn("bad event", err); } };
  ws.onclose = () => { setConn("offline"); retry(opened ? 0 : attempt + 1); };
}
function retry(attempt) {
  const delay = Math.min(10000, 1000 * 2 ** Math.min(attempt, 4));
  setTimeout(() => connect(attempt), delay);
}

function playScript(script, callId) {
  let endAt = 0;
  for (const [sec, type, body] of script) {
    endAt = Math.max(endAt, sec);
    setTimeout(() => {
      const at = new Date().toISOString();
      const m = { type, callId, at, ...body };
      if (m.alert) m.alert = { callId, at, ...m.alert };
      handle(m);
    }, sec * 1000);
  }
  return new Promise((r) => setTimeout(r, endAt * 1000 + 100));
}
